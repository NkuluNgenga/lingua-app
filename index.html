<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>LinguaLite SRS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
  <header class="app-header">
    <h1 class="logo">LinguaLite</h1>
    <div class="stats-badge" id="stats-badge">
      <span id="due-count">0</span> pendientes
    </div>
  </header>

  <!-- Contenedor dinámico principal -->
  <main class="app-main">

    <!-- Vista 1: Biblioteca (Gestor de lecturas) -->
    <section id="view-library" class="view active">
      <div class="library-header">
        <h2>Mis Lecturas</h2>
        <div class="library-actions">
          <label class="btn-secondary" for="file-import">
            <span>📁 Importar Archivo</span>
            <input type="file" id="file-import" accept=".json" style="display: none;">
          </label>
          <button id="btn-open-paste-modal" class="btn-secondary">📋 Pegar JSON</button>
        </div>
      </div>

      <!-- Lista de textos guardados -->
      <div id="library-list" class="library-list">
        <!-- Renderizado dinámicamente con JS -->
      </div>

      <!-- Cuadro modal ligero para pegar JSON directamente -->
      <div id="paste-modal" class="modal hidden">
        <div class="modal-content">
          <h3>Pegar texto en formato JSON</h3>
          <textarea id="paste-json-input" placeholder='Pega aquí el JSON generado por la IA...' rows="8"></textarea>
          <div class="modal-buttons">
            <button id="btn-cancel-paste" class="btn-secondary">Cancelar</button>
            <button id="btn-confirm-paste" class="btn-primary">Guardar Lectura</button>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Vista 2: Lector Contextual -->
    <section id="view-reader" class="view">
      <div class="reader-toolbar">
        <button id="btn-back-to-library" class="btn-secondary">← Volver a Biblioteca</button>
      </div>

      <article class="reader-card">
        <h2 id="reader-title" class="reader-title">Sin lectura seleccionada</h2>
        <div id="reader-content" class="reader-content">
          <p class="placeholder-text">Selecciona una lectura en la biblioteca para comenzar.</p>
        </div>
      </article>

      <!-- Panel flotante de glosa -->
      <aside id="gloss-panel" class="gloss-panel hidden">
        <div class="gloss-content">
          <div class="gloss-word-info">
            <span id="gloss-word" class="gloss-word"></span>
            <span id="gloss-phonetic" class="gloss-phonetic"></span>
          </div>
          <p id="gloss-definition" class="gloss-definition"></p>
        </div>
        <button id="btn-add-deck" class="btn-primary">Añadir a Repaso</button>
      </aside>
    </section>

    <!-- Vista 3: Repaso SRS / Flashcards -->
    <section id="view-review" class="view">
      <div class="review-container">
        <div class="card-counter">
          Tarjeta <span id="card-index">0</span> de <span id="card-total">0</span>
        </div>

        <div class="flashcard" id="flashcard">
          <div class="card-side card-front">
            <span class="card-prompt" id="card-front-text">Presiona Iniciar</span>
            <span class="card-hint" id="card-hint-text"></span>
          </div>
          <div class="card-side card-back hidden" id="card-back-side">
            <hr class="card-divider">
            <span class="card-answer" id="card-back-text">Traducción</span>
          </div>
        </div>

        <div class="review-actions">
          <button id="btn-show-answer" class="btn-primary full-width">Mostrar Respuesta</button>
          
          <div id="srs-rating-buttons" class="rating-grid hidden">
            <button class="btn-rating btn-again" data-rating="again">Otra vez<br><small>1m</small></button>
            <button class="btn-rating btn-hard" data-rating="hard">Difícil<br><small>1d</small></button>
            <button class="btn-rating btn-good" data-rating="good">Bien<br><small>3d</small></button>
            <button class="btn-rating btn-easy" data-rating="easy">Fácil<br><small>5d</small></button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Barra inferior de navegación (3 pestañas optimizadas para pulgar) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-target="view-library">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Biblioteca</span>
    </button>
    <button class="nav-btn" data-target="view-reader">
      <span class="nav-icon">📖</span>
      <span class="nav-label">Lectura</span>
    </button>
    <button class="nav-btn" data-target="view-review">
      <span class="nav-icon">🧠</span>
      <span class="nav-label">Repasar</span>
    </button>
  </nav>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW activo:', reg.scope))
          .catch(err => console.error('Error SW:', err));
      });
    }
  </script>
</body>
</html>
